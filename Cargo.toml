[workspace]
resolver = "3"
members = ["packages/aist-core", "packages/aist-spec"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
homepage = "https://github.com/DenisGorbachev/aist"
repository = "https://github.com/DenisGorbachev/aist"
keywords = []
categories = []
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "CargoMetadata.ts",
    "README.ts",
    "AGENTS*.md",
    "CLAUDE*.md",
    "deno.lock",
    "deno.json",
    "commitlint.config.mjs",
    "fnox.toml",
    "mise.toml",
    "rumdl.toml",
    "rustfmt.toml",
    ".yolobox"
]

[workspace.metadata.details]
name = "aist"
title = ""
readme = { generate = false }

[workspace.lints.rust]
redundant_imports = "deny"
unused_import_braces = "deny"
# unused_qualifications must not be "deny" because our code style has multiple `use Foo::*;`, and some macros (derive_more::Display, strum::Display, strum::EnumString) produce code with full qualifications
# unused_qualifications = "deny"

[workspace.lints.clippy]
absolute_paths = "deny"
arithmetic_side_effects = "deny"

[package]
name = "aist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[package.metadata.details]
title = ""

[lints]
workspace = true

[dependencies]
errgonomic = { git = "https://github.com/DenisGorbachev/errgonomic" }
clap = { version = "4.6.6", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
save-load = { git = "https://github.com/DenisGorbachev/save-load", version = "0.1.0", features = ["clap", "serde_json", "serde_yaml", "toml"] }
ra_ap_hir = "0.0.349"
ra_ap_ide_db = "0.0.349"
ra_ap_syntax = "0.0.349"
ra_ap_vfs = "0.0.349"
aist-core = { version = "0.1.0", path = "packages/aist-core" }
